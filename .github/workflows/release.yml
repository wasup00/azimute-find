# Push a tag like v1.2.0 -> builds a signed release APK and publishes a GitHub release with it attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The Android SDK is preinstalled on GitHub runners (ANDROID_HOME); AGP fetches missing platforms.
      - uses: gradle/actions/setup-gradle@v5

      - name: Write secrets to local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Test and build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "azimute-finder-$VERSION.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Install instructions go above the auto-generated changelog.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$VERSION/g" .github/release-install.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "azimute-finder-$VERSION.apk" \
            --title "Azimute finder $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
